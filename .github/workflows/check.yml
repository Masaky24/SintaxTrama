name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 1
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Core and native Windows tests
        run: |
          cargo +stable test --locked --manifest-path src-tauri/core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked --manifest-path tools/native-tests/Cargo.toml
      - name: TypeScript tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Editor workflows in Edge
        run: npm run test:ui

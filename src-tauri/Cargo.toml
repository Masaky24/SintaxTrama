[package]
name = "pliegra"
version = "0.1.6"
edition = "2021"
license = "MIT"
authors = ["G9C_Studios"]
description = "Editor local de Markdown y texto para Windows"
repository = "https://github.com/Masaky24/SintaxTrama"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
editor-md-core = { path = "core" }
rfd = "0.15"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_Graphics_DirectWrite"] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
